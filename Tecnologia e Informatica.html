<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro di Tecnologia e Informatica - Scuola Primaria</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Exo+2:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Exo 2', 'Segoe UI', Tahoma, sans-serif;
    background: radial-gradient(ellipse at top, #1a1a2e 0%, #0f0f1e 50%, #000000 100%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 20px;
    color: #E0E0E0;
  }

  .container { max-width: 1150px; margin: 0 auto; }

  header { text-align: center; padding: 20px 20px 15px 20px; margin-bottom: 20px; }
  header h1 {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.4em;
    margin-bottom: 8px;
    color: #00E5FF;
    text-shadow: 0 0 10px #00E5FF, 0 0 20px #00E5FF, 0 0 40px #00B8D4, 3px 3px 0 #003D4D;
    letter-spacing: 2px;
    font-weight: 800;
  }
  header p {
    font-family: 'Orbitron', sans-serif;
    font-size: 1em;
    color: #00E676;
    font-weight: 600;
    background: rgba(0, 0, 0, 0.6);
    display: inline-block;
    padding: 8px 24px;
    border-radius: 30px;
    border: 1px solid #00E676;
    box-shadow: 0 0 15px rgba(0, 230, 118, 0.4), inset 0 0 15px rgba(0, 230, 118, 0.1);
    letter-spacing: 1px;
  }

  .circuit-deco {
    display: inline-block;
    width: 20px; height: 20px;
    border: 2px solid #00E676;
    border-radius: 50%;
    margin: 0 5px;
    vertical-align: middle;
    position: relative;
    box-shadow: 0 0 10px #00E676;
  }
  .circuit-deco::after {
    content: "";
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 6px; height: 6px;
    background: #00E676;
    border-radius: 50%;
    box-shadow: 0 0 8px #00E676;
  }

  .search-bar { position: relative; max-width: 700px; margin: 0 auto 20px auto; }
  .search-bar input {
    width: 100%;
    padding: 15px 50px 15px 20px;
    border: 2px solid #00E5FF;
    border-radius: 12px;
    font-family: 'Exo 2', sans-serif;
    font-size: 1em;
    font-weight: 500;
    background: rgba(0, 0, 0, 0.7);
    color: #00E5FF;
    outline: none;
    transition: all 0.3s ease;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.3), inset 0 0 10px rgba(0, 229, 255, 0.1);
    letter-spacing: 0.5px;
  }
  .search-bar input:focus {
    border-color: #00E676;
    box-shadow: 0 0 30px rgba(0, 230, 118, 0.6), inset 0 0 15px rgba(0, 230, 118, 0.15);
    color: #00E676;
  }
  .search-bar input::placeholder { color: #4DB6AC; }
  .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.2em; color: #00E5FF; pointer-events: none; }
  .search-clear {
    position: absolute; right: 48px; top: 50%; transform: translateY(-50%);
    background: #FF1744; color: white; border: none;
    width: 26px; height: 26px; border-radius: 50%; cursor: pointer;
    font-weight: bold; display: none; align-items: center; justify-content: center; font-size: 0.85em;
    box-shadow: 0 0 10px #FF1744;
  }
  .search-clear.visible { display: flex; }

  .search-results-info {
    text-align: center;
    color: #00E676;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9em;
    margin-bottom: 15px;
    min-height: 20px;
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0, 230, 118, 0.5);
  }

  .search-highlight {
    background: #00E676;
    color: #000;
    padding: 1px 4px;
    border-radius: 4px;
    font-weight: bold;
    box-shadow: 0 0 10px #00E676;
  }

  .main-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .main-tab {
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid #00E5FF;
    color: #00E5FF;
    padding: 13px 28px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.95em;
    font-weight: 600;
    transition: all 0.3s ease;
    letter-spacing: 1px;
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.3);
  }
  .main-tab:hover { background: rgba(0, 229, 255, 0.15); transform: translateY(-3px); }
  .main-tab.active {
    background: linear-gradient(135deg, #00E5FF, #00B8D4);
    color: #000;
    border-color: #00E5FF;
    box-shadow: 0 0 25px rgba(0, 229, 255, 0.8), 0 0 40px rgba(0, 229, 255, 0.4);
  }

  .section { display: none; animation: fadeIn 0.5s ease; }
  .section.active { display: block; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .timeline-nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; }
  .nav-btn {
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid #00E676;
    color: #00E676;
    padding: 12px 26px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 1em;
    font-weight: 700;
    transition: all 0.3s ease;
    box-shadow: 0 0 15px rgba(0, 230, 118, 0.3);
    letter-spacing: 1px;
  }
  .nav-btn:hover { background: rgba(0, 230, 118, 0.15); transform: translateY(-3px); }
  .nav-btn.active {
    background: linear-gradient(135deg, #00E676, #00C853);
    color: #000;
    border-color: #00E676;
    box-shadow: 0 0 25px rgba(0, 230, 118, 0.8), 0 0 40px rgba(0, 230, 118, 0.4);
    transform: scale(1.05);
  }

  .year-card {
    background: linear-gradient(135deg, rgba(15, 15, 30, 0.95), rgba(26, 26, 46, 0.95));
    border: 1px solid rgba(0, 229, 255, 0.3);
    border-radius: 16px;
    padding: 35px;
    box-shadow: 0 0 40px rgba(0, 229, 255, 0.15), inset 0 0 40px rgba(0, 229, 255, 0.03);
    animation: fadeIn 0.5s ease;
    display: none;
    position: relative;
    overflow: hidden;
  }
  .year-card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 3px;
    background: linear-gradient(90deg, #00E5FF, #00E676, #FF9100, #FF1744, #D500F9);
    box-shadow: 0 0 15px rgba(0, 229, 255, 0.8);
  }
  .year-card.active { display: block; }

  .year-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
    padding-bottom: 18px;
    border-bottom: 1px dashed rgba(0, 230, 118, 0.4);
    flex-wrap: wrap;
  }
  .year-badge {
    background: linear-gradient(135deg, #00E5FF, #00E676);
    color: #000;
    width: 90px;
    height: 90px;
    border-radius: 14px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Orbitron', sans-serif;
    font-size: 2em;
    font-weight: 800;
    flex-shrink: 0;
    box-shadow: 0 0 25px rgba(0, 229, 255, 0.8), 0 0 50px rgba(0, 230, 118, 0.4);
    border: 2px solid #00E676;
    letter-spacing: 1px;
  }
  .year-title h2 {
    color: #00E5FF;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.7em;
    margin-bottom: 5px;
    font-weight: 700;
    letter-spacing: 1px;
    text-shadow: 0 0 15px rgba(0, 229, 255, 0.5);
  }
  .year-title p { color: #00E676; font-size: 0.95em; font-weight: 500; letter-spacing: 0.5px; }

  .book-intro {
    background: linear-gradient(135deg, rgba(0, 229, 255, 0.08), rgba(0, 230, 118, 0.08));
    border-radius: 12px;
    padding: 18px 22px;
    margin-bottom: 22px;
    border-left: 4px solid #00E5FF;
    color: #B0E0E6;
    line-height: 1.7;
    font-size: 0.98em;
    font-weight: 400;
  }
  .book-intro strong { color: #00E676; font-weight: 700; text-shadow: 0 0 8px rgba(0, 230, 118, 0.4); }

  .theme-section { margin-bottom: 25px; }
  .theme-section h3 {
    color: #00E5FF;
    font-family: 'Orbitron', sans-serif;
    font-size: 1.2em;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-shadow: 0 0 10px rgba(0, 229, 255, 0.5);
  }
  .theme-section h3::before { content: "💻"; font-size: 1.1em; }

  .topic-list { list-style: none; }

  .topic-item {
    background: rgba(0, 0, 0, 0.4);
    border-left: 4px solid #00E5FF;
    margin-bottom: 12px;
    border-radius: 10px;
    overflow: hidden;
    transition: all 0.3s ease;
    border: 1px solid rgba(0, 229, 255, 0.2);
  }
  .topic-item:hover { border-color: rgba(0, 229, 255, 0.6); box-shadow: 0 0 20px rgba(0, 229, 255, 0.2); }
  .topic-item.open { border-left-color: #00E676; background: rgba(0, 230, 118, 0.05); border-color: rgba(0, 230, 118, 0.5); }

  .topic-header {
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.95em;
    line-height: 1.5;
    user-select: none;
    transition: background 0.2s ease;
    font-weight: 600;
    color: #00E5FF;
    letter-spacing: 0.5px;
  }
  .topic-header:hover { background: rgba(0, 229, 255, 0.08); }
  .topic-item.open .topic-header { background: rgba(0, 230, 118, 0.1); color: #00E676; }

  .topic-toggle-icon {
    color: #00E5FF;
    font-size: 1em;
    font-weight: bold;
    transition: transform 0.3s ease;
    flex-shrink: 0;
    width: 28px; height: 28px;
    background: rgba(0, 229, 255, 0.1);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid #00E5FF;
  }
  .topic-item.open .topic-toggle-icon { transform: rotate(180deg); background: #00E676; color: #000; border-color: #00E676; box-shadow: 0 0 15px #00E676; }

  .topic-body { max-height: 0; overflow: hidden; transition: max-height 0.8s ease; padding: 0 20px; }
  .topic-item.open .topic-body { max-height: 40000px; padding: 0 20px 20px 20px; }

  .topic-detail {
    background: rgba(0, 0, 0, 0.3);
    border-radius: 10px;
    padding: 22px;
    margin-top: 5px;
    border: 1px solid rgba(0, 229, 255, 0.2);
  }

  .topic-detail h4 {
    color: #00E676;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.95em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding-bottom: 6px;
    border-bottom: 1px dashed rgba(0, 230, 118, 0.3);
    font-weight: 600;
    letter-spacing: 1px;
  }
  .topic-detail h4:first-child { margin-top: 0; }

  .lezione-text {
    color: #C8D6E5;
    font-size: 0.98em;
    line-height: 1.8;
    text-align: justify;
  }
  .lezione-text p { margin-bottom: 14px; }
  .lezione-text p:last-child { margin-bottom: 0; }
  .lezione-text strong { color: #00E5FF; font-weight: 600; }
  .lezione-text em { color: #00E676; font-style: normal; font-weight: 500; }

  .lezione-text .capolettera::first-letter {
    font-family: 'Orbitron', sans-serif;
    font-size: 2.8em;
    font-weight: 800;
    float: left;
    line-height: 0.85;
    margin: 6px 10px 0 0;
    color: #00E676;
    text-shadow: 0 0 15px rgba(0, 230, 118, 0.6);
  }

  .box-approfondimento, .box-curiosita, .box-personaggi, .box-vita, .box-fonti,
  .box-oggi, .box-glossario, .box-attivita {
    border-radius: 10px;
    padding: 15px 18px;
    margin: 10px 0;
    font-size: 0.92em;
    line-height: 1.65;
    border-left: 3px solid;
    background: rgba(0, 0, 0, 0.4);
  }
  .box-approfondimento { color: #81D4FA; border-left-color: #29B6F6; }
  .box-curiosita { color: #FFF59D; border-left-color: #FFEB3B; }
  .box-personaggi { color: #CE93D8; border-left-color: #AB47BC; }
  .box-vita { color: #80DEEA; border-left-color: #00BCD4; }
  .box-fonti { color: #F48FB1; border-left-color: #EC407A; }
  .box-oggi { color: #A5D6A7; border-left-color: #66BB6A; }
  .box-glossario { color: #FFCC80; border-left-color: #FFA726; }
  .box-attivita { color: #FFAB91; border-left-color: #FF7043; }

  .box-personaggi ul, .box-fonti ul, .box-glossario ul, .box-attivita ul { list-style: none; margin-top: 6px; }
  .box-personaggi li { padding: 4px 0 4px 22px; position: relative; }
  .box-personaggi li::before { content: "👤"; position: absolute; left: 0; font-size: 0.85em; }
  .box-fonti li { padding: 4px 0 4px 22px; position: relative; }
  .box-fonti li::before { content: "🔎"; position: absolute; left: 0; font-size: 0.85em; }
  .box-glossario li { padding: 4px 0 4px 18px; position: relative; }
  .box-glossario li::before { content: "📌"; position: absolute; left: 0; font-size: 0.8em; }
  .box-attivita li { padding: 4px 0 4px 22px; position: relative; }
  .box-attivita li::before { content: "✏️"; position: absolute; left: 0; font-size: 0.85em; }

  .box-cronologia {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 10px;
    padding: 15px 18px;
    margin: 10px 0;
    border-left: 3px solid #78909C;
    color: #B0BEC5;
  }
  .box-cronologia .crono-title { color: #CFD8DC; font-family: 'Orbitron', sans-serif; font-weight: 600; margin-bottom: 8px; font-size: 0.9em; letter-spacing: 1px; }
  .box-cronologia ul { list-style: none; }
  .box-cronologia li { padding: 4px 0 4px 22px; position: relative; color: #B0BEC5; line-height: 1.5; font-size: 0.9em; }
  .box-cronologia li::before { content: "⏱"; position: absolute; left: 0; font-size: 0.9em; }

  .box-mappa {
    background: rgba(0, 0, 0, 0.4);
    border-radius: 10px;
    padding: 15px 20px;
    margin: 10px 0;
    border-left: 3px solid #AB47BC;
    color: #CE93D8;
  }
  .box-mappa .mappa-title { color: #E1BEE7; font-family: 'Orbitron', sans-serif; font-weight: 600; margin-bottom: 8px; font-size: 0.9em; letter-spacing: 1px; }
  .box-mappa ul { list-style: none; }
  .box-mappa li { padding: 4px 0 4px 22px; position: relative; color: #CE93D8; line-height: 1.5; font-size: 0.9em; }
  .box-mappa li::before { content: "◆"; position: absolute; left: 4px; color: #AB47BC; font-size: 0.8em; }
  .box-mappa ul ul li::before { content: "▸"; color: #BA68C8; }
  .box-mappa ul ul { padding-left: 12px; margin-top: 3px; }

  .box-verifica {
    background: rgba(255, 23, 68, 0.08);
    border-radius: 10px;
    padding: 15px 20px;
    margin: 10px 0;
    border-left: 3px solid #FF1744;
    color: #FF8A80;
  }
  .box-verifica .verifica-title { color: #FF5252; font-family: 'Orbitron', sans-serif; font-weight: 600; margin-bottom: 8px; font-size: 0.9em; letter-spacing: 1px; }
  .box-verifica ol, .box-verifica ul { padding-left: 22px; color: #FFAB91; line-height: 1.6; font-size: 0.9em; }
  .box-verifica li { padding: 4px 0; }
  .box-verifica .vf { list-style: none; padding-left: 0; }
  .box-verifica .vf li { padding: 3px 0 3px 26px; position: relative; }
  .box-verifica .vf li::before { content: "◻"; position: absolute; left: 4px; font-size: 1em; color: #FF5252; }

  .expand-all-btn {
    background: linear-gradient(135deg, #00E5FF, #00B8D4);
    border: none;
    color: #000;
    padding: 11px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85em;
    font-weight: 700;
    transition: all 0.3s ease;
    margin-bottom: 12px;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.5);
    letter-spacing: 1px;
  }
  .expand-all-btn:hover { transform: translateY(-2px); box-shadow: 0 0 30px rgba(0, 229, 255, 0.8); }

  .activities {
    background: linear-gradient(135deg, rgba(0, 230, 118, 0.08), rgba(0, 229, 255, 0.08));
    padding: 22px;
    border-radius: 12px;
    margin-top: 22px;
    border: 1px dashed rgba(0, 230, 118, 0.5);
  }
  .activities h3 { color: #00E676; font-family: 'Orbitron', sans-serif; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; font-size: 1em; font-weight: 600; letter-spacing: 1px; }
  .activities h3::before { content: "🎯"; font-size: 1.15em; }
  .activities ul { list-style: none; }
  .activities li { padding: 6px 0 6px 25px; position: relative; color: #A5D6A7; line-height: 1.5; font-weight: 400; }
  .activities li::before { content: "▸"; position: absolute; left: 5px; color: #00E676; font-weight: bold; }

  .progress-bar { margin-top: 25px; background: rgba(0, 0, 0, 0.5); border-radius: 8px; height: 12px; overflow: hidden; border: 1px solid rgba(0, 229, 255, 0.3); box-shadow: inset 0 2px 5px rgba(0,0,0,0.5); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #00E5FF, #00E676, #FF9100); border-radius: 8px; transition: width 0.5s ease; box-shadow: 0 0 15px rgba(0, 230, 118, 0.6); }
  .progress-label { text-align: center; margin-top: 8px; color: #00E676; font-family: 'Orbitron', sans-serif; font-size: 0.85em; font-weight: 600; letter-spacing: 1px; }

  .controls { display: flex; justify-content: space-between; margin-top: 25px; gap: 15px; flex-wrap: wrap; }
  .ctrl-btn {
    background: linear-gradient(135deg, #00E5FF, #00B8D4);
    color: #000;
    border: none;
    padding: 14px 30px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.9em;
    font-weight: 700;
    transition: all 0.3s ease;
    flex: 1;
    min-width: 140px;
    box-shadow: 0 0 20px rgba(0, 229, 255, 0.4);
    letter-spacing: 1px;
  }
  .ctrl-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 0 30px rgba(0, 229, 255, 0.8); }
  .ctrl-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  .print-btn {
    background: linear-gradient(135deg, #00E676, #00C853);
    border: none;
    color: #000;
    padding: 12px 24px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85em;
    font-weight: 700;
    transition: all 0.3s ease;
    box-shadow: 0 0 20px rgba(0, 230, 118, 0.4);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .print-btn:hover { transform: translateY(-3px); box-shadow: 0 0 30px rgba(0, 230, 118, 0.8); }

  .print-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

  .resources-intro {
    background: linear-gradient(135deg, rgba(15, 15, 30, 0.95), rgba(26, 26, 46, 0.95));
    border-radius: 16px;
    padding: 30px;
    margin-bottom: 22px;
    box-shadow: 0 0 30px rgba(0, 229, 255, 0.2);
    text-align: center;
    border: 1px solid rgba(0, 229, 255, 0.4);
  }
  .resources-intro h2 { color: #00E5FF; font-family: 'Orbitron', sans-serif; font-size: 1.5em; margin-bottom: 10px; text-shadow: 0 0 15px rgba(0, 229, 255, 0.5); letter-spacing: 1px; }
  .resources-intro p { color: #B0BEC5; font-size: 0.95em; line-height: 1.6; max-width: 700px; margin: 0 auto; }

  .resource-filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }
  .filter-btn {
    background: rgba(0, 0, 0, 0.6);
    border: 2px solid #00E676;
    color: #00E676;
    padding: 10px 22px;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.85em;
    font-weight: 600;
    transition: all 0.3s ease;
    letter-spacing: 0.5px;
  }
  .filter-btn:hover { background: rgba(0, 230, 118, 0.15); transform: translateY(-2px); }
  .filter-btn.active { background: linear-gradient(135deg, #00E676, #00C853); color: #000; box-shadow: 0 0 20px rgba(0, 230, 118, 0.6); }

  .resources-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

  .resource-card {
    background: linear-gradient(135deg, rgba(15, 15, 30, 0.95), rgba(26, 26, 46, 0.95));
    border-radius: 14px;
    padding: 22px;
    box-shadow: 0 0 25px rgba(0, 229, 255, 0.15);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    border-top: 3px solid #00E5FF;

function renderNav() {
  const nav = document.getElementById('navButtons');
  nav.innerHTML = '';
  programmi.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.className = 'nav-btn' + (i === currentIndex ? ' active' : '');
    btn.textContent = `${p.anno}°`;
    btn.onclick = () => goTo(i);
    nav.appendChild(btn);
  });

function highlightText(text, query) {
  if (!query) return text;
  const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return text.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="search-highlight">$1</span>');
}

function matchSearch(arg, query) {
  if (!query) return true;
  const q = query.toLowerCase();
  const parts = [
    arg.titolo || '', ...(arg.lezione || []), arg.approfondimento || '',
    arg.curiosita || '', arg.vita || '', arg.oggi || '',
    ...(arg.glossario || []).map(g => g.termine + ' ' + g.definizione),
    ...(arg.personaggi || []).map(p => p.nome + ' ' + p.descrizione),
    ...(arg.fonti || []),
    ...(arg.mappa || []).map(m => m.nodo + ' ' + (m.figli || []).join(' ')),
    ...(arg.verifica || []), ...(arg.verificaVF || []), ...(arg.attivitaPratiche || [])
  ];
  return parts.join(' ').toLowerCase().includes(q);
}

function renderArgomento(a, i, j, query, isSearchActive) {
  let extraHtml = "";
  if (a.approfondimento) extraHtml += `<h4>🔍 Approfondimento</h4><div class="box-approfondimento">${highlightText(a.approfondimento, query)}</div>`;
  if (a.personaggi) extraHtml += `<h4>👤 Personaggi</h4><div class="box-personaggi"><ul>${a.personaggi.map(p => `<li><strong>${highlightText(p.nome, query)}:</strong> ${highlightText(p.descrizione, query)}</li>`).join('')}</ul></div>`;
  if (a.vita) extraHtml += `<h4>🌍 Vita quotidiana</h4><div class="box-vita">${highlightText(a.vita, query)}</div>`;
  if (a.fonti) extraHtml += `<h4>🔎 Fonti</h4><div class="box-fonti"><ul>${a.fonti.map(f => `<li>${highlightText(f, query)}</li>`).join('')}</ul></div>`;
  if (a.curiosita) extraHtml += `<h4>🌟 Lo sapevi?</h4><div class="box-curiosita">${highlightText(a.curiosita, query)}</div>`;
  if (a.oggi) extraHtml += `<h4>🌐 Collegamenti con oggi</h4><div class="box-oggi">${highlightText(a.oggi, query)}</div>`;
  if (a.cronologia) extraHtml += `<h4>⏱ Cronologia</h4><div class="box-cronologia"><div class="crono-title">Date importanti</div><ul>${a.cronologia.map(c => `<li><strong>${highlightText(c.data, query)}:</strong> ${highlightText(c.evento, query)}</li>`).join('')}</ul></div>`;
  if (a.glossario) extraHtml += `<h4>📚 Glossario</h4><div class="box-glossario"><ul>${a.glossario.map(g => `<li><strong>${highlightText(g.termine, query)}:</strong> ${highlightText(g.definizione, query)}</li>`).join('')}</ul></div>`;
  if (a.mappa) extraHtml += `<h4>🗺️ Mappa concettuale</h4><div class="box-mappa"><div class="mappa-title">Schema riassuntivo</div><ul>${a.mappa.map(m => `<li><strong>${highlightText(m.nodo, query)}</strong><ul>${m.figli.map(f => `<li>${highlightText(f, query)}</li>`).join('')}</ul></li>`).join('')}</ul></div>`;
  if (a.verifica) extraHtml += `<h4>✅ Verifica - Domande aperte</h4><div class="box-verifica"><div class="verifica-title">Rispondi alle domande</div><ol>${a.verifica.map(v => `<li>${highlightText(v, query)}</li>`).join('')}</ol></div>`;
  if (a.verificaVF) extraHtml += `<div class="box-verifica"><div class="verifica-title">Vero o Falso</div><ul class="vf">${a.verificaVF.map(v => `<li>${highlightText(v, query)}</li>`).join('')}</ul></div>`;
  if (a.attivitaPratiche) extraHtml += `<h4>✏️ Attività pratiche</h4><div class="box-attivita"><ul>${a.attivitaPratiche.map(at => `<li>${highlightText(at, query)}</li>`).join('')}</ul></div>`;
  const openClass = isSearchActive ? 'open' : '';
  return `
    <li class="topic-item ${openClass}" id="topic-${i}-${j}">
      <div class="topic-header" onclick="toggleTopic(${i}, ${j})">
        <span>${highlightText(a.titolo, query)}</span>
        <span class="topic-toggle-icon">▼</span>
      </div>
      <div class="topic-body">
        <div class="topic-detail">
          <h4>📖 Lezione</h4>
          <div class="lezione-text">${a.lezione.map((par, k) => `<p${k === 0 ? ' class="capolettera"' : ''}>${highlightText(par, query)}</p>`).join('')}</div>
          ${extraHtml}
        </div>
      </div>
    </li>`;
}

function renderCards() {
  const container = document.getElementById('yearCards');
  container.innerHTML = '';
  const query = currentSearch.trim();
  const isSearchActive = query.length > 0;
  let totalMatches = 0;
  const matchesPerClasse = [];

  programmi.forEach((p, i) => {
    const filteredArgomenti = p.argomenti.filter(a => matchSearch(a, query));
    const matchCount = filteredArgomenti.length;
    matchesPerClasse.push(matchCount);
    totalMatches += matchCount;

    const card = document.createElement('div');
    card.className = 'year-card' + (i === currentIndex ? ' active' : '');
    card.dataset.classe = i;

    if (isSearchActive && matchCount === 0) {
      card.style.display = 'none';
      container.appendChild(card);
      return;
    }

    card.innerHTML = `
      <div class="year-header">
        <div class="year-badge">${p.anno}°</div>
        <div class="year-title">
          <h2>${p.titolo}</h2>
          <p>${p.sottotitolo}</p>
        </div>
      </div>
      <div class="book-intro">${p.introduzione}</div>
      <div class="theme-section">
        <h3>${isSearchActive ? `Risultati della ricerca (${matchCount})` : 'Lezioni del libro'}</h3>
        <button class="expand-all-btn" onclick="toggleAllTopics(${i})">Espandi / Comprimi tutte le lezioni</button>
        <ul class="topic-list">
          ${filteredArgomenti.map((a) => {
            const originalIndex = p.argomenti.indexOf(a);
            return renderArgomento(a, i, originalIndex, query, isSearchActive);
          }).join('')}
        </ul>
      </div>
      <div class="activities">
        <h3>Attività e laboratori suggeriti</h3>
        <ul>${p.attivita.map(a => `<li>${a}</li>`).join('')}</ul>
      </div>
      <div class="progress-bar"><div class="progress-fill" style="width: ${((i + 1) / programmi.length) * 100}%"></div></div>
      <p class="progress-label">Anno ${p.anno} di 5 - ${Math.round(((i + 1) / programmi.length) * 100)}% del percorso</p>
      <div class="controls">
        <button class="ctrl-btn" onclick="prev()" ${i === 0 ? 'disabled' : ''}>← Precedente</button>
        <button class="ctrl-btn" onclick="next()" ${i === programmi.length - 1 ? 'disabled' : ''}>Successivo →</button>
      </div>`;
    container.appendChild(card);
  });

  const info = document.getElementById('searchInfo');
  if (isSearchActive) {
    info.textContent = totalMatches > 0
      ? `🔍 Trovati ${totalMatches} argomenti in ${matchesPerClasse.filter(c => c > 0).length} classi per "${query}"`
      : `😕 Nessun risultato per "${query}". Prova con un'altra parola.`;
    info.style.color = totalMatches > 0 ? '#00E676' : '#FFD700';
    if (totalMatches > 0 && matchesPerClasse[currentIndex] === 0) {
      const firstMatch = matchesPerClasse.findIndex(c => c > 0);
      if (firstMatch !== -1) {
        currentIndex = firstMatch;
        renderNav();
        document.querySelectorAll('.year-card').forEach((c, idx) => {
          c.classList.toggle('active', idx === currentIndex);
        });
      }
    }
  } else {
    info.textContent = '';
  }
}

function toggleTopic(annoIndex, topicIndex) {
  const item = document.getElementById(`topic-${annoIndex}-${topicIndex}`);
  if (item) item.classList.toggle('open');
}

function toggleAllTopics(annoIndex) {
  const items = document.querySelectorAll(`[id^="topic-${annoIndex}-"]`);
  const anyOpen = Array.from(items).some(it => it.classList.contains('open'));
  items.forEach(it => it.classList.toggle('open', !anyOpen));
}

function goTo(index) {
  currentIndex = index;
  renderNav();
  document.querySelectorAll('.year-card').forEach((c, i) => {
    c.classList.toggle('active', i === currentIndex);
  });
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function next() { if (currentIndex < programmi.length - 1) goTo(currentIndex + 1); }
function prev() { if (currentIndex > 0) goTo(currentIndex - 1); }

/* ===================== STAMPA ===================== */
function printCurrent() {
  document.querySelectorAll('.year-card').forEach(c => c.classList.remove('print-target'));
  const current = document.querySelector(`.year-card[data-classe="${currentIndex}"]`);
  if (current) current.classList.add('print-target');
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.querySelectorAll('.year-card').forEach(c => c.classList.remove('print-target'));
    }, 800);
  }, 150);
}

function printAll() {
  document.querySelectorAll('.year-card').forEach(c => {
    c.classList.add('print-target');
    c.style.display = 'block';
  });
  setTimeout(() => {
    window.print();
    setTimeout(() => {
      document.querySelectorAll('.year-card').forEach(c => {
        c.classList.remove('print-target');
        c.style.display = '';
      });
    }, 800);
  }, 150);
}

function initSearch() {
  const input = document.getElementById('searchInput');
  const clear = document.getElementById('searchClear');
  let debounceTimer;

  input.addEventListener('input', (e) => {
    const val = e.target.value;
    clear.classList.toggle('visible', val.length > 0);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      currentSearch = val;
      renderCards();
    }, 250);
  });

  clear.addEventListener('click', () => {
    input.value = '';
    currentSearch = '';
    clear.classList.remove('visible');
    renderCards();
    input.focus();
  });

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      input.value = '';
      currentSearch = '';
      clear.classList.remove('visible');
      renderCards();
    }
  });
}

const typeLabels = { video: "🎥 Video", sito: "🌐 Sito", app: "📱 App", podcast: "🎧 Podcast", gioco: "🎮 Gioco" };
let currentFilter = 'tutti';

function renderResources() {
  const grid = document.getElementById('resourcesGrid');
  grid.innerHTML = '';
  const filtered = currentFilter === 'tutti' ? risorse : risorse.filter(r => r.tipo === currentFilter);
  if (filtered.length === 0) {
    grid.innerHTML = `<div class="no-results">Nessuna risorsa trovata per questa categoria.</div>`;
    return;
  }
  filtered.forEach(r => {
    const card = document.createElement('div');
    card.className = 'resource-card';
    card.dataset.type = r.tipo;
    card.innerHTML = `
      <span class="resource-type-badge">${typeLabels[r.tipo] || r.tipo}</span>
      <h3>${r.titolo}</h3>
      <p>${r.descrizione}</p>
      <div class="resource-meta">${r.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
      <a class="resource-link" href="${r.link}" target="_blank" rel="noopener noreferrer">Apri risorsa →</a>`;
    grid.appendChild(card);
  });
}

function initResourceFilters() {
  const filters = document.getElementById('resourceFilters');
  filters.addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    filters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFilter = btn.dataset.filter;
    renderResources();
  });
}

function switchSection(sectionId, btn) {
  document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
  if (btn) btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById(sectionId).classList.add('active');
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

renderNav();
renderCards();
renderResources();
initResourceFilters();
initSearch();
</script>
