<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro di Scienze - Scuola Primaria</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
    background: 
      radial-gradient(circle at 15% 15%, rgba(147, 197, 253, 0.4) 0%, transparent 35%),
      radial-gradient(circle at 85% 25%, rgba(165, 243, 252, 0.4) 0%, transparent 35%),
      radial-gradient(circle at 30% 85%, rgba(196, 181, 253, 0.3) 0%, transparent 40%),
      radial-gradient(circle at 75% 90%, rgba(134, 239, 172, 0.3) 0%, transparent 40%),
      linear-gradient(135deg, #EFF6FF 0%, #DBEAFE 30%, #CFFAFE 60%, #E0F2FE 100%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 20px;
    color: #1E3A8A;
    position: relative;
  }

  /* Provetta decorativa in alto a sinistra */
  body::before {
    content: "🧪";
    position: fixed;
    top: 15px;
    left: 15px;
    font-size: 3em;
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
    animation: floatTestTube 5s ease-in-out infinite;
  }
  /* Atomo decorativo in alto a destra */
  body::after {
    content: "⚛️";
    position: fixed;
    top: 15px;
    right: 15px;
    font-size: 3em;
    opacity: 0.4;
    z-index: 0;
    pointer-events: none;
    animation: floatAtom 6s ease-in-out infinite;
  }
  @keyframes floatTestTube {
    0%, 100% { transform: translateY(0) rotate(-5deg); }
    50% { transform: translateY(-8px) rotate(5deg); }
  }
  @keyframes floatAtom {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-10px) rotate(15deg); }
  }

  .container { max-width: 1150px; margin: 0 auto; position: relative; z-index: 1; }

  /* ===================== HEADER ===================== */
  header {
    text-align: center;
    padding: 25px 20px 20px 20px;
    margin-bottom: 22px;
  }
  header h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 3em;
    margin-bottom: 10px;
    color: #FFFFFF;
    text-shadow: 
      4px 4px 0 #0284C7,
      -1px -1px 0 #0284C7,
      1px -1px 0 #0284C7,
      -1px 1px 0 #0284C7,
      1px 1px 0 #0284C7,
      0 8px 20px rgba(2, 132, 199, 0.5);
    letter-spacing: 1px;
    font-weight: 700;
  }
  header p {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15em;
    color: #075985;
    font-weight: 500;
    background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
    display: inline-block;
    padding: 8px 24px;
    border-radius: 30px;
    box-shadow: 0 4px 0 #0EA5E9, 0 6px 15px rgba(0,0,0,0.12);
    border: 2px solid #0EA5E9;
  }

  /* ===================== BARRA DI RICERCA ===================== */
  .search-bar { position: relative; max-width: 700px; margin: 0 auto 22px auto; }
  .search-bar input {
    width: 100%;
    padding: 16px 55px 16px 55px;
    border: 4px solid #7DD3FC;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 1.05em;
    font-weight: 700;
    background: white;
    color: #1E3A8A;
    outline: none;
    transition: all 0.3s ease;
    box-shadow: 0 6px 0 #0EA5E9, 0 8px 20px rgba(14, 165, 233, 0.35);
  }
  .search-bar input:focus {
    border-color: #818CF8;
    box-shadow: 0 6px 0 #6366F1, 0 10px 25px rgba(99, 102, 241, 0.45);
    transform: translateY(-2px);
  }
  .search-bar input::placeholder { color: #7DD3FC; font-weight: 600; }
  .search-icon {
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 1.4em;
    pointer-events: none;
  }
  .search-clear {
    position: absolute; right: 15px; top: 50%; transform: translateY(-50%);
    background: #6366F1; color: white; border: none;
    width: 30px; height: 30px; border-radius: 50%; cursor: pointer;
    font-weight: bold; display: none; align-items: center; justify-content: center; font-size: 1em;
    box-shadow: 0 3px 8px rgba(99, 102, 241, 0.5);
    transition: transform 0.2s ease;
  }
  .search-clear:hover { transform: translateY(-50%) scale(1.15) rotate(90deg); }
  .search-clear.visible { display: flex; }

  .search-results-info {
    text-align: center;
    color: #075985;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.05em;
    margin-bottom: 15px;
    min-height: 24px;
    font-weight: 500;
  }
  .search-highlight {
    background: #FEF08A;
    padding: 1px 5px;
    border-radius: 6px;
    font-weight: 800;
    color: #713F12;
  }

  /* ===================== TAB ===================== */
  .main-tabs { display: flex; justify-content: center; gap: 12px; margin-bottom: 22px; flex-wrap: wrap; }
  .main-tab {
    background: white;
    border: 4px solid #7DD3FC;
    color: #0284C7;
    padding: 13px 28px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.05em;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 5px 0 #0EA5E9, 0 7px 15px rgba(0,0,0,0.1);
  }
  .main-tab:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #0EA5E9, 0 10px 20px rgba(0,0,0,0.15); }
  .main-tab.active {
    background: linear-gradient(135deg, #0EA5E9, #0284C7);
    color: white;
    border-color: #0369A1;
    box-shadow: 0 5px 0 #075985, 0 8px 18px rgba(14, 165, 233, 0.5);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }

  .section { display: none; animation: fadeIn 0.5s ease; }
  .section.active { display: block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  /* ===================== NAV CLASSE ===================== */
  .timeline-nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-bottom: 28px; }
  .nav-btn {
    background: white;
    border: 4px solid #A5F3FC;
    color: #0E7490;
    padding: 12px 24px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.2em;
    font-weight: 700;
    transition: all 0.3s ease;
    box-shadow: 0 5px 0 #67E8F9, 0 7px 15px rgba(0,0,0,0.1);
    min-width: 70px;
  }
  .nav-btn:hover { transform: translateY(-3px) rotate(-3deg); box-shadow: 0 8px 0 #67E8F9, 0 10px 20px rgba(0,0,0,0.15); }
  .nav-btn.active {
    background: linear-gradient(135deg, #06B6D4, #0891B2);
    color: white;
    border-color: #0E7490;
    box-shadow: 0 5px 0 #164E63, 0 8px 18px rgba(6, 182, 212, 0.5);
    transform: scale(1.08);
  }

  /* ===================== CARD CLASSE ===================== */
  .year-card {
    background: white;
    border-radius: 30px;
    padding: 35px;
    box-shadow: 0 20px 50px rgba(14, 165, 233, 0.18), 0 0 0 6px rgba(255,255,255,0.6);
    animation: fadeIn 0.5s ease;
    display: none;
    position: relative;
    overflow: hidden;
  }
  .year-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 10px;
    background: linear-gradient(90deg, #0284C7, #0EA5E9, #38BDF8, #7DD3FC, #A78BFA, #818CF8);
  }
  .year-card::after {
    content: "🔬";
    position: absolute;
    top: 20px;
    right: 25px;
    font-size: 2em;
    opacity: 0.15;
    pointer-events: none;
  }
  .year-card.active { display: block; }

  .year-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
    padding-bottom: 20px;
    border-bottom: 4px dashed #BAE6FD;
    flex-wrap: wrap;
  }
  .year-badge {
    background: linear-gradient(135deg, #0EA5E9, #0284C7);
    color: white;
    width: 95px;
    height: 95px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 2.4em;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 0 7px 0 #075985, 0 10px 22px rgba(14, 165, 233, 0.5);
    text-shadow: 2px 2px 4px rgba(0,0,0,0.25);
    border: 4px solid white;
    animation: wiggleBadge 5s ease-in-out infinite;
  }
  @keyframes wiggleBadge {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-5deg); }
    75% { transform: rotate(5deg); }
  }
  .year-title h2 {
    color: #1E3A8A;
    font-family: 'Fredoka', sans-serif;
    font-size: 2em;
    margin-bottom: 4px;
    font-weight: 700;
  }
  .year-title p { color: #0369A1; font-size: 1em; font-weight: 600; }

  .book-intro {
    background: linear-gradient(135deg, #DBEAFE, #BFDBFE);
    border-radius: 20px;
    padding: 20px 25px;
    margin-bottom: 25px;
    border-left: 8px solid #0EA5E9;
    color: #1E3A8A;
    line-height: 1.7;
    font-size: 1em;
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(14, 165, 233, 0.2);
    position: relative;
  }
  .book-intro::before {
    content: "💡";
    position: absolute;
    top: -14px;
    left: 18px;
    font-size: 1.8em;
    background: white;
    border-radius: 50%;
    width: 42px;
    height: 42px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    border: 3px solid #0EA5E9;
  }
  .book-intro strong { color: #0369A1; }

  /* ===================== ARGOMENTI ===================== */
  .theme-section { margin-bottom: 28px; }
  .theme-section h3 {
    color: #0284C7;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.4em;
    margin-bottom: 15px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
  }
  .theme-section h3::before { content: "🔬"; font-size: 1.2em; }

  .topic-list { list-style: none; }
  .topic-item {
    background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
    border-left: 8px solid #38BDF8;
    margin-bottom: 12px;
    border-radius: 20px;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 3px 10px rgba(56, 189, 248, 0.15);
  }
  .topic-item:hover { box-shadow: 0 8px 20px rgba(56, 189, 248, 0.3); transform: translateX(4px); }
  .topic-item.open {
    border-left-color: #6366F1;
    background: linear-gradient(135deg, #EEF2FF, #E0E7FF);
  }

  .topic-header {
    padding: 18px 22px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.05em;
    line-height: 1.5;
    user-select: none;
    transition: background 0.2s ease;
    font-weight: 600;
    color: #1E3A8A;
  }
  .topic-header:hover { background: rgba(56, 189, 248, 0.1); }
  .topic-item.open .topic-header { background: rgba(99, 102, 241, 0.12); color: #3730A3; }

  .topic-toggle-icon {
    color: #0284C7;
    font-size: 1.2em;
    font-weight: bold;
    transition: transform 0.3s ease;
    flex-shrink: 0;
    width: 34px;
    height: 34px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 3px 8px rgba(0,0,0,0.15);
    border: 2px solid #7DD3FC;
  }
  .topic-item.open .topic-toggle-icon {
    transform: rotate(180deg);
    background: linear-gradient(135deg, #6366F1, #4F46E5);
    color: white;
    border-color: #4F46E5;
  }

  .topic-body { max-height: 0; overflow: hidden; transition: max-height 0.9s ease; padding: 0 22px; }
  .topic-item.open .topic-body { max-height: 40000px; padding: 0 22px 22px 22px; }

  .topic-detail {
    background: white;
    border-radius: 16px;
    padding: 25px;
    margin-top: 5px;
    border: 3px solid #BAE6FD;
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
  }

  .topic-detail h4 {
    color: #0369A1;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.15em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 24px;
    padding-bottom: 8px;
    border-bottom: 3px dotted #DBEAFE;
    font-weight: 600;
  }
  .topic-detail h4:first-child { margin-top: 0; }

  .lezione-text {
    color: #1F2937;
    font-size: 1.02em;
    line-height: 1.85;
    text-align: justify;
    font-weight: 500;
  }
  .lezione-text p { margin-bottom: 15px; }
  .lezione-text p:last-child { margin-bottom: 0; }

  .lezione-text .capolettera::first-letter {
    font-family: 'Fredoka', sans-serif;
    font-size: 3.2em;
    font-weight: 700;
    float: left;
    line-height: 0.85;
    margin: 8px 12px 0 0;
    color: #0EA5E9;
    text-shadow: 3px 3px 0 #BAE6FD;
  }

  /* ===================== BOX ===================== */
  .box-approfondimento, .box-curiosita, .box-personaggi, .box-vita,
  .box-fonti, .box-oggi, .box-glossario, .box-attivita {
    border-radius: 16px;
    padding: 18px 22px;
    margin: 12px 0;
    font-size: 0.98em;
    line-height: 1.7;
    border-left: 6px solid;
    font-weight: 500;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  }
  .box-approfondimento { background: linear-gradient(135deg, #DBEAFE, #BFDBFE); color: #1E3A8A; border-left-color: #3B82F6; }
  .box-curiosita { background: linear-gradient(135deg, #FEF3C7, #FDE68A); color: #78350F; border-left-color: #F59E0B; }
  .box-personaggi { background: linear-gradient(135deg, #EDE9FE, #DDD6FE); color: #4C1D95; border-left-color: #8B5CF6; }
  .box-vita { background: linear-gradient(135deg, #D1FAE5, #A7F3D0); color: #065F46; border-left-color: #10B981; }
  .box-fonti { background: linear-gradient(135deg, #FEF9C3, #FEF08A); color: #713F12; border-left-color: #EAB308; }
  .box-oggi { background: linear-gradient(135deg, #CFFAFE, #A5F3FC); color: #164E63; border-left-color: #06B6D4; }
  .box-glossario { background: linear-gradient(135deg, #FFEDD5, #FED7AA); color: #7C2D12; border-left-color: #F97316; }
  .box-attivita { background: linear-gradient(135deg, #FCE7F3, #FBCFE8); color: #831843; border-left-color: #EC4899; }

  .box-personaggi ul, .box-fonti ul, .box-glossario ul, .box-attivita ul { list-style: none; margin-top: 8px; }
  .box-personaggi li { padding: 5px 0 5px 26px; position: relative; }
  .box-personaggi li::before { content: "👤"; position: absolute; left: 0; font-size: 0.95em; }
  .box-fonti li { padding: 5px 0 5px 26px; position: relative; }
  .box-fonti li::before { content: "🔎"; position: absolute; left: 0; font-size: 0.95em; }
  .box-glossario li { padding: 5px 0 5px 22px; position: relative; }
  .box-glossario li::before { content: "📌"; position: absolute; left: 0; font-size: 0.85em; }
  .box-attivita li { padding: 5px 0 5px 26px; position: relative; }
  .box-attivita li::before { content: "✏️"; position: absolute; left: 0; font-size: 0.95em; }

  .box-cronologia {
    background: linear-gradient(135deg, #F1F5F9, #E2E8F0);
    border-radius: 16px;
    padding: 18px 22px;
    margin: 12px 0;
    border-left: 6px solid #64748B;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  }
  .box-cronologia .crono-title { color: #334155; font-family: 'Fredoka', sans-serif; font-weight: 600; margin-bottom: 10px; font-size: 1em; }
  .box-cronologia ul { list-style: none; }
  .box-cronologia li { padding: 5px 0 5px 26px; position: relative; color: #475569; line-height: 1.6; font-size: 0.95em; }
  .box-cronologia li::before { content: "⏱"; position: absolute; left: 0; font-size: 0.95em; }

  .box-mappa {
    background: linear-gradient(135deg, #EFF6FF, #DBEAFE);
    border-radius: 16px;
    padding: 18px 24px;
    margin: 12px 0;
    border-left: 6px solid #6366F1;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  }
  .box-mappa .mappa-title { color: #4338CA; font-family: 'Fredoka', sans-serif; font-weight: 600; margin-bottom: 10px; font-size: 1em; }
  .box-mappa ul { list-style: none; }
  .box-mappa li { padding: 5px 0 5px 26px; position: relative; color: #444; line-height: 1.6; font-size: 0.95em; }
  .box-mappa li::before { content: "◆"; position: absolute; left: 4px; color: #6366F1; font-size: 0.85em; }
  .box-mappa ul ul li::before { content: "▸"; color: #818CF8; }
  .box-mappa ul ul { padding-left: 14px; margin-top: 4px; }

  .box-verifica {
    background: linear-gradient(135deg, #FEE2E2, #FECACA);
    border-radius: 16px;
    padding: 18px 24px;
    margin: 12px 0;
    border-left: 6px solid #EF4444;
    box-shadow: 0 3px 10px rgba(0,0,0,0.06);
  }
  .box-verifica .verifica-title { color: #B91C1C; font-family: 'Fredoka', sans-serif; font-weight: 600; margin-bottom: 10px; font-size: 1em; }
  .box-verifica ol, .box-verifica ul { padding-left: 24px; color: #7F1D1D; line-height: 1.7; font-size: 0.95em; }
  .box-verifica li { padding: 5px 0; }
  .box-verifica .vf { list-style: none; padding-left: 0; }
  .box-verifica .vf li { padding: 5px 0 5px 30px; position: relative; }
  .box-verifica .vf li::before { content: "◻"; position: absolute; left: 4px; font-size: 1.1em; }

  .expand-all-btn {
    background: linear-gradient(135deg, #0EA5E9, #0284C7);
    border: none;
    color: white;
    padding: 12px 26px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 1em;
    font-weight: 600;
    transition: all 0.3s ease;
    margin-bottom: 15px;
    box-shadow: 0 5px 0 #075985, 0 7px 15px rgba(14, 165, 233, 0.35);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }
  .expand-all-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #075985, 0 10px 20px rgba(14, 165, 233, 0.45); }

  .activities {
    background: linear-gradient(135deg, #CFFAFE, #A5F3FC);
    padding: 25px;
    border-radius: 20px;
    margin-top: 25px;
    border: 3px dashed #06B6D4;
  }
  .activities h3 { color: #164E63; font-family: 'Fredoka', sans-serif; margin-bottom: 15px; display: flex; align-items: center; gap: 10px; font-size: 1.2em; font-weight: 600; }
  .activities h3::before { content: "🎯"; font-size: 1.2em; }
  .activities ul { list-style: none; }
  .activities li { padding: 8px 0 8px 30px; position: relative; color: #155E75; line-height: 1.6; font-weight: 600; font-size: 1em; }
  .activities li::before { content: "▸"; position: absolute; left: 8px; color: #0891B2; font-weight: bold; font-size: 1.2em; }

  .progress-bar { margin-top: 25px; background: #DBEAFE; border-radius: 20px; height: 16px; overflow: hidden; border: 3px solid white; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, #0284C7, #0EA5E9, #38BDF8, #7DD3FC, #A78BFA, #6366F1);
    border-radius: 20px;
    transition: width 0.5s ease;
  }
  .progress-label { text-align: center; margin-top: 10px; color: #1E3A8A; font-family: 'Fredoka', sans-serif; font-size: 0.95em; font-weight: 600; }

  .controls { display: flex; justify-content: space-between; margin-top: 28px; gap: 15px; flex-wrap: wrap; }
  .ctrl-btn {
    background: linear-gradient(135deg, #38BDF8, #0EA5E9);
    color: white;
    border: none;
    padding: 15px 32px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 1em;
    font-weight: 600;
    transition: all 0.3s ease;
    flex: 1;
    min-width: 140px;
    box-shadow: 0 5px 0 #075985, 0 7px 18px rgba(56, 189, 248, 0.35);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }
  .ctrl-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 0 #075985, 0 10px 22px rgba(56, 189, 248, 0.45); }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .print-btn {
    background: linear-gradient(135deg, #A78BFA, #8B5CF6);
    border: none;
    color: white;
    padding: 12px 24px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.95em;
    font-weight: 600;
    transition: all 0.3s ease;

      nav.appendChild(btn);
    });

  function highlightText(text, query) {
    if (!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="search-highlight">$1</span>');
  }

  function matchSearch(arg, query) {
    if (!query) return true;
    const q = query.toLowerCase();
    const parts = [
      arg.titolo || '', ...(arg.lezione || []), arg.approfondimento || '',
      arg.curiosita || '', arg.vita || '', arg.oggi || '',
      ...(arg.glossario || []).map(g => g.termine + ' ' + g.definizione),
      ...(arg.personaggi || []).map(p => p.nome + ' ' + p.descrizione),
      ...(arg.fonti || []),
      ...(arg.mappa || []).map(m => m.nodo + ' ' + (m.figli || []).join(' ')),
      ...(arg.verifica || []), ...(arg.verificaVF || []), ...(arg.attivitaPratiche || [])
    ];
    return parts.join(' ').toLowerCase().includes(q);
  }

  function renderArgomento(a, i, j, query, isSearchActive) {
    let extraHtml = "";
    if (a.approfondimento) extraHtml += `<h4>🔍 Approfondimento</h4><div class="box-approfondimento">${highlightText(a.approfondimento, query)}</div>`;
    if (a.personaggi) extraHtml += `<h4>👤 Personaggi</h4><div class="box-personaggi"><ul>${a.personaggi.map(p => `<li><strong>${highlightText(p.nome, query)}:</strong> ${highlightText(p.descrizione, query)}</li>`).join('')}</ul></div>`;
    if (a.vita) extraHtml += `<h4>🏺 Vita quotidiana</h4><div class="box-vita">${highlightText(a.vita, query)}</div>`;
    if (a.fonti) extraHtml += `<h4>🔎 Fonti e strumenti</h4><div class="box-fonti"><ul>${a.fonti.map(f => `<li>${highlightText(f, query)}</li>`).join('')}</ul></div>`;
    if (a.curiosita) extraHtml += `<h4>🌟 Lo sapevi?</h4><div class="box-curiosita">${highlightText(a.curiosita, query)}</div>`;
    if (a.oggi) extraHtml += `<h4>🌍 Collegamenti con oggi</h4><div class="box-oggi">${highlightText(a.oggi, query)}</div>`;
    if (a.cronologia) extraHtml += `<h4>⏱ Cronologia</h4><div class="box-cronologia"><div class="crono-title">Date importanti</div><ul>${a.cronologia.map(c => `<li><strong>${highlightText(c.data, query)}:</strong> ${highlightText(c.evento, query)}</li>`).join('')}</ul></div>`;
    if (a.glossario) extraHtml += `<h4>📚 Glossario</h4><div class="box-glossario"><ul>${a.glossario.map(g => `<li><strong>${highlightText(g.termine, query)}:</strong> ${highlightText(g.definizione, query)}</li>`).join('')}</ul></div>`;
    if (a.mappa) extraHtml += `<h4>🗺️ Mappa concettuale</h4><div class="box-mappa"><div class="mappa-title">Schema riassuntivo</div><ul>${a.mappa.map(m => `<li><strong>${highlightText(m.nodo, query)}</strong><ul>${m.figli.map(f => `<li>${highlightText(f, query)}</li>`).join('')}</ul></li>`).join('')}</ul></div>`;
    if (a.verifica) extraHtml += `<h4>✅ Verifica - Domande aperte</h4><div class="box-verifica"><div class="verifica-title">Rispondi alle domande</div><ol>${a.verifica.map(v => `<li>${highlightText(v, query)}</li>`).join('')}</ol></div>`;
    if (a.verificaVF) extraHtml += `<div class="box-verifica"><div class="verifica-title">Vero o Falso</div><ul class="vf">${a.verificaVF.map(v => `<li>${highlightText(v, query)}</li>`).join('')}</ul></div>`;
    if (a.attivitaPratiche) extraHtml += `<h4>✏️ Attività pratiche</h4><div class="box-attivita"><ul>${a.attivitaPratiche.map(at => `<li>${highlightText(at, query)}</li>`).join('')}</ul></div>`;
    const openClass = isSearchActive ? 'open' : '';

    return `
      <li class="topic-item ${openClass}" id="topic-${i}-${j}">
        <div class="topic-header" onclick="toggleTopic(${i}, ${j})">
          <span>${highlightText(a.titolo, query)}</span>
          <span class="topic-toggle-icon">▼</span>
        </div>
        <div class="topic-body">
          <div class="topic-detail">
            <h4>📖 Lezione</h4>
            <div class="lezione-text">${a.lezione.map((par, k) => `<p${k === 0 ? ' class="capolettera"' : ''}>${highlightText(par, query)}</p>`).join('')}</div>
            ${extraHtml}
          </div>
        </div>
      </li>`;
  }

  function renderCards() {
    const container = document.getElementById('yearCards');
    container.innerHTML = '';
    const query = currentSearch.trim();
    const isSearchActive = query.length > 0;
    let totalMatches = 0;
    const matchesPerClasse = [];

    programmi.forEach((p, i) => {
      const filteredArgomenti = p.argomenti.filter(a => matchSearch(a, query));
      const matchCount = filteredArgomenti.length;
      matchesPerClasse.push(matchCount);
      totalMatches += matchCount;

      const card = document.createElement('div');
      card.className = 'year-card' + (i === currentIndex ? ' active' : '');
      card.dataset.classe = i;

      if (isSearchActive && matchCount === 0) {
        card.style.display = 'none';
        container.appendChild(card);
        return;
      }

      card.innerHTML = `
        <div class="year-header">
          <div class="year-badge">${p.anno}°</div>
          <div class="year-title">
            <h2>${p.titolo}</h2>
            <p>${p.sottotitolo}</p>
          </div>
        </div>
        <div class="book-intro">${p.introduzione}</div>
        <div class="theme-section">
          <h3>${isSearchActive ? `Risultati della ricerca (${matchCount})` : 'Lezioni del libro'}</h3>
          <button class="expand-all-btn" onclick="toggleAllTopics(${i})">Espandi / Comprimi tutte le lezioni</button>
          <ul class="topic-list">
            ${filteredArgomenti.map((a) => {
              const originalIndex = p.argomenti.indexOf(a);
              return renderArgomento(a, i, originalIndex, query, isSearchActive);
            }).join('')}
          </ul>
        </div>
        <div class="activities">
          <h3>Attività e laboratori suggeriti</h3>
          <ul>${p.attivita.map(a => `<li>${a}</li>`).join('')}</ul>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${((i + 1) / programmi.length) * 100}%"></div></div>
        <p class="progress-label">Anno ${p.anno} di 5 - ${Math.round(((i + 1) / programmi.length) * 100)}% del percorso</p>
        <div class="controls">
          <button class="ctrl-btn" onclick="prev()" ${i === 0 ? 'disabled' : ''}>← Precedente</button>
          <button class="ctrl-btn" onclick="next()" ${i === programmi.length - 1 ? 'disabled' : ''}>Successivo →</button>
        </div>`;
      container.appendChild(card);
    });

    const info = document.getElementById('searchInfo');
    if (isSearchActive) {
      info.textContent = totalMatches > 0
        ? `🔍 Trovati ${totalMatches} argomenti in ${matchesPerClasse.filter(c => c > 0).length} classi per "${query}"`
        : `😕 Nessun risultato per "${query}". Prova con un'altra parola.`;
      info.style.color = totalMatches > 0 ? '#075985' : '#E74C3C';
      if (totalMatches > 0 && matchesPerClasse[currentIndex] === 0) {
        const firstMatch = matchesPerClasse.findIndex(c => c > 0);
        if (firstMatch !== -1) {
          currentIndex = firstMatch;
          renderNav();
          document.querySelectorAll('.year-card').forEach((c, idx) => {
            c.classList.toggle('active', idx === currentIndex);
          });
        }
      }
    } else {
      info.textContent = '';
    }
  }

  function toggleTopic(annoIndex, topicIndex) {
    const item = document.getElementById(`topic-${annoIndex}-${topicIndex}`);
    if (item) item.classList.toggle('open');
  }

  function toggleAllTopics(annoIndex) {
    const items = document.querySelectorAll(`[id^="topic-${annoIndex}-"]`);
    const anyOpen = Array.from(items).some(it => it.classList.contains('open'));
    items.forEach(it => it.classList.toggle('open', !anyOpen));
  }

  function goTo(index) {
    currentIndex = index;
    renderNav();
    document.querySelectorAll('.year-card').forEach((c, i) => {
      c.classList.toggle('active', i === currentIndex);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function next() { if (currentIndex < programmi.length - 1) goTo(currentIndex + 1); }
  function prev() { if (currentIndex > 0) goTo(currentIndex - 1); }

  function printCurrent() {
    document.querySelectorAll('.year-card').forEach(c => c.classList.remove('print-target'));
    const current = document.querySelector(`.year-card[data-classe="${currentIndex}"]`);
    if (current) current.classList.add('print-target');
    
    setTimeout(() => {
      window.print();
      setTimeout(() => {
        document.querySelectorAll('.year-card').forEach(c => c.classList.remove('print-target'));
      }, 800);
    }, 150);
  }

  function printAll() {
    document.querySelectorAll('.year-card').forEach(c => {
      c.classList.add('print-target');
      c.style.display = 'block';
    });
    
    setTimeout(() => {
      window.print();
      setTimeout(() => {
        document.querySelectorAll('.year-card').forEach(c => {
          c.classList.remove('print-target');
          c.style.display = '';
        });
      }, 800);
    }, 150);
  }

  function initSearch() {
    const input = document.getElementById('searchInput');
    const clear = document.getElementById('searchClear');
    let debounceTimer;

    input.addEventListener('input', (e) => {
      const val = e.target.value;
      clear.classList.toggle('visible', val.length > 0);
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        currentSearch = val;
        renderCards();
      }, 250);
    });

    clear.addEventListener('click', () => {
      input.value = '';
      currentSearch = '';
      clear.classList.remove('visible');
      renderCards();
      input.focus();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        input.value = '';
        currentSearch = '';
        clear.classList.remove('visible');
        renderCards();
      }
    });
  }

  const typeLabels = { video: "🎥 Video", sito: "🌐 Sito", app: "📱 App", podcast: "🎧 Podcast", gioco: "🎮 Gioco" };
  let currentFilter = 'tutti';

  function renderResources() {
    const grid = document.getElementById('resourcesGrid');
    grid.innerHTML = '';
    const filtered = currentFilter === 'tutti' ? risorse : risorse.filter(r => r.tipo === currentFilter);
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="no-results">Nessuna risorsa trovata per questa categoria.</div>`;
      return;
    }
    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'resource-card';
      card.dataset.type = r.tipo;
      card.innerHTML = `
        <span class="resource-type-badge">${typeLabels[r.tipo] || r.tipo}</span>
        <h3>${r.titolo}</h3>
        <p>${r.descrizione}</p>
        <div class="resource-meta">${r.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <a class="resource-link" href="${r.link}" target="_blank" rel="noopener noreferrer">Apri risorsa →</a>`;
      grid.appendChild(card);
    });
  }

  function initResourceFilters() {
    const filters = document.getElementById('resourceFilters');
    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      filters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderResources();
    });
  }

  function switchSection(sectionId, btn) {
    document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  renderNav();
  renderCards();
  renderResources();
  initResourceFilters();
  initSearch();
</script>
</body>
</html>
