<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Libro di Storia - Scuola Primaria</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #87CEEB 0%, #B5E7F5 50%, #FFE7A0 100%);
    background-attachment: fixed;
    min-height: 100vh;
    padding: 20px;
    color: #333;
  }

  .container { max-width: 1150px; margin: 0 auto; }

  header { text-align: center; padding: 20px 20px 15px 20px; margin-bottom: 20px; }
  header h1 {
    font-family: 'Fredoka', sans-serif;
    font-size: 2.6em;
    margin-bottom: 8px;
    color: white;
    text-shadow: 3px 3px 0 #2C5F9E, -1px -1px 0 #2C5F9E, 1px -1px 0 #2C5F9E, -1px 1px 0 #2C5F9E, 1px 1px 0 #2C5F9E;
    letter-spacing: 1px;
  }
  header p {
    font-family: 'Fredoka', sans-serif;
    font-size: 1.1em;
    color: #2C5F9E;
    font-weight: 500;
    background: rgba(255,255,255,0.85);
    display: inline-block;
    padding: 6px 20px;
    border-radius: 30px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  .search-bar { position: relative; max-width: 700px; margin: 0 auto 20px auto; }
  .search-bar input {
    width: 100%;
    padding: 15px 50px 15px 20px;
    border: 4px solid #FFD93D;
    border-radius: 50px;
    font-family: 'Nunito', sans-serif;
    font-size: 1em;
    font-weight: 600;
    background: white;
    color: #333;
    outline: none;
    transition: all 0.3s ease;
    box-shadow: 0 5px 0 #F0B90B, 0 6px 20px rgba(0,0,0,0.1);
  }
  .search-bar input:focus {
    border-color: #FF9F43;
    box-shadow: 0 5px 0 #E67E22, 0 8px 25px rgba(255, 159, 67, 0.4);
  }
  .search-bar input::placeholder { color: #999; }
  .search-icon { position: absolute; right: 20px; top: 50%; transform: translateY(-50%); font-size: 1.2em; color: #764ba2; pointer-events: none; }
  .search-clear {
    position: absolute; right: 48px; top: 50%; transform: translateY(-50%);
    background: #FF6B6B; color: white; border: none;
    width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
    font-weight: bold; display: none; align-items: center; justify-content: center; font-size: 0.85em;
  }
  .search-clear.visible { display: flex; }

  .search-results-info {
    text-align: center;
    color: #2C5F9E;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.95em;
    margin-bottom: 15px;
    min-height: 20px;
    font-weight: 600;
  }

  .search-highlight {
    background: #FFD93D;
    padding: 1px 4px;
    border-radius: 5px;
    font-weight: bold;
    color: #2C5F9E;
  }

  .main-tabs { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

  .main-tab {
    background: white;
    border: none;
    color: #4A90E2;
    padding: 13px 26px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.05em;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 5px 0 #C7DFF5, 0 6px 15px rgba(0,0,0,0.1);
  }
  .main-tab:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #C7DFF5, 0 8px 20px rgba(0,0,0,0.15); }
  .main-tab.active {
    background: linear-gradient(135deg, #FF9F43, #FFD93D);
    color: white;
    box-shadow: 0 5px 0 #E67E22, 0 8px 15px rgba(255, 159, 67, 0.4);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
  }

  .section { display: none; animation: fadeIn 0.5s ease; }
  .section.active { display: block; }

  @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

  .timeline-nav { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }

  .nav-btn {
    background: white;
    border: 4px solid #A78BFA;
    color: #A78BFA;
    padding: 12px 24px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.1em;
    font-weight: 700;
    transition: all 0.3s ease;
    box-shadow: 0 5px 0 #C4B5FD, 0 6px 15px rgba(0,0,0,0.1);
  }
  .nav-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #C4B5FD, 0 8px 20px rgba(0,0,0,0.15); }
  .nav-btn.active {
    background: linear-gradient(135deg, #A78BFA, #7C3AED);
    color: white;
    border-color: #7C3AED;
    box-shadow: 0 5px 0 #5B21B6, 0 8px 15px rgba(167, 139, 250, 0.4);
    transform: scale(1.05);
  }

  .year-card {
    background: white;
    border-radius: 25px;
    padding: 35px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.15);
    animation: fadeIn 0.5s ease;
    display: none;
    position: relative;
    overflow: hidden;
  }
  .year-card::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 8px;
    background: linear-gradient(90deg, #FF6B6B, #FFD93D, #6BCB77, #4A90E2, #A78BFA);
  }
  .year-card.active { display: block; }

  .year-header {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
    padding-bottom: 18px;
    border-bottom: 3px dashed #FFD93D;
    flex-wrap: wrap;
  }

  .year-badge {
    background: linear-gradient(135deg, #FF9F43, #FF6B6B);
    color: white;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Fredoka', sans-serif;
    font-size: 2.2em;
    font-weight: 700;
    flex-shrink: 0;
    box-shadow: 0 6px 0 #E67E22, 0 8px 20px rgba(255, 159, 67, 0.4);
    text-shadow: 2px 2px 4px rgba(0,0,0,0.2);
  }

  .year-title h2 {
    color: #2C5F9E;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.8em;
    margin-bottom: 5px;
    font-weight: 700;
  }
  .year-title p { color: #666; font-size: 0.95em; font-weight: 600; }

  .book-intro {
    background: linear-gradient(135deg, #FFF9E6, #FFE7A0);
    border-radius: 16px;
    padding: 18px 22px;
    margin-bottom: 22px;
    border-left: 6px solid #FFD93D;
    color: #6B4C1F;
    line-height: 1.6;
    font-size: 0.98em;
    font-weight: 600;
  }
  .book-intro strong { color: #C2410C; }

  .theme-section { margin-bottom: 25px; }
  .theme-section h3 {
    color: #7C3AED;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.3em;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
  }
  .theme-section h3::before { content: "📚"; font-size: 1.1em; }

  .topic-list { list-style: none; }

  .topic-item {
    background: #F0F8FF;
    border-left: 6px solid #4A90E2;
    margin-bottom: 10px;
    border-radius: 14px;
    overflow: hidden;
    transition: all 0.3s ease;
    box-shadow: 0 2px 8px rgba(74, 144, 226, 0.1);
  }
  .topic-item:hover { box-shadow: 0 4px 15px rgba(74, 144, 226, 0.25); }
  .topic-item.open { border-left-color: #FF9F43; background: #FFF9E6; }

  .topic-header {
    padding: 16px 20px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 15px;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.05em;
    line-height: 1.5;
    user-select: none;
    transition: background 0.2s ease;
    font-weight: 500;
    color: #2C5F9E;
  }
  .topic-header:hover { background: rgba(74, 144, 226, 0.08); }
  .topic-item.open .topic-header { background: rgba(255, 159, 67, 0.15); color: #C2410C; }

  .topic-toggle-icon {
    color: #4A90E2;
    font-size: 1.2em;
    font-weight: bold;
    transition: transform 0.3s ease;
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    background: white;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
  }
  .topic-item.open .topic-toggle-icon { transform: rotate(180deg); background: #FF9F43; color: white; }

  .topic-body { max-height: 0; overflow: hidden; transition: max-height 0.8s ease; padding: 0 20px; }
  .topic-item.open .topic-body { max-height: 40000px; padding: 0 20px 20px 20px; }

  .topic-detail {
    background: white;
    border-radius: 12px;
    padding: 22px;
    margin-top: 5px;
    border: 2px solid #FFD93D;
  }

  .topic-detail h4 {
    color: #7C3AED;
    font-family: 'Fredoka', sans-serif;
    font-size: 1.05em;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 22px;
    padding-bottom: 6px;
    border-bottom: 2px dashed #E0D5FF;
    font-weight: 600;
  }
  .topic-detail h4:first-child { margin-top: 0; }

  .lezione-text {
    color: #3d3d3d;
    font-size: 1em;
    line-height: 1.8;
    text-align: justify;
  }
  .lezione-text p { margin-bottom: 14px; }
  .lezione-text p:last-child { margin-bottom: 0; }

  .lezione-text .capolettera::first-letter {
    font-family: 'Fredoka', sans-serif;
    font-size: 2.8em;
    font-weight: bold;
    float: left;
    line-height: 0.85;
    margin: 6px 10px 0 0;
    color: #FF9F43;
  }

  .box-approfondimento, .box-curiosita, .box-personaggi, .box-vita, .box-fonti, .box-oggi, .box-glossario, .box-attivita {
    border-radius: 12px;
    padding: 15px 18px;
    margin: 10px 0;
    font-size: 0.95em;
    line-height: 1.65;
    border-left: 4px solid;
  }
  .box-approfondimento { background: #DBEAFE; color: #1E3A8A; border-left-color: #3B82F6; }
  .box-curiosita { background: #FEF3C7; color: #78350F; border-left-color: #F59E0B; }
  .box-personaggi { background: #EDE9FE; color: #4C1D95; border-left-color: #8B5CF6; }
  .box-vita { background: #CFFAFE; color: #164E63; border-left-color: #06B6D4; }
  .box-fonti { background: #FCE7F3; color: #831843; border-left-color: #EC4899; }
  .box-oggi { background: #D1FAE5; color: #064E3B; border-left-color: #10B981; }
  .box-glossario { background: #FEF9C3; color: #713F12; border-left-color: #EAB308; }
  .box-attivita { background: #FFEDD5; color: #7C2D12; border-left-color: #F97316; }

  .box-personaggi ul, .box-fonti ul, .box-glossario ul, .box-attivita ul { list-style: none; margin-top: 6px; }
  .box-personaggi li { padding: 4px 0 4px 22px; position: relative; }
  .box-personaggi li::before { content: "👤"; position: absolute; left: 0; font-size: 0.85em; }
  .box-fonti li { padding: 4px 0 4px 22px; position: relative; }
  .box-fonti li::before { content: "🔎"; position: absolute; left: 0; font-size: 0.85em; }
  .box-glossario li { padding: 4px 0 4px 18px; position: relative; }
  .box-glossario li::before { content: "📌"; position: absolute; left: 0; font-size: 0.8em; }
  .box-attivita li { padding: 4px 0 4px 22px; position: relative; }
  .box-attivita li::before { content: "✏️"; position: absolute; left: 0; font-size: 0.85em; }

  .box-cronologia {
    background: #F3F4F6;
    border-radius: 12px;
    padding: 15px 18px;
    margin: 10px 0;
    border-left: 4px solid #6B7280;
  }
  .box-cronologia .crono-title { color: #374151; font-family: 'Fredoka', sans-serif; font-weight: 600; margin-bottom: 8px; font-size: 0.95em; }
  .box-cronologia ul { list-style: none; }
  .box-cronologia li { padding: 4px 0 4px 22px; position: relative; color: #444; line-height: 1.5; font-size: 0.92em; }
  .box-cronologia li::before { content: "⏱"; position: absolute; left: 0; font-size: 0.9em; }

  .box-mappa {
    background: #F5F3FF;
    border-radius: 12px;
    padding: 15px 20px;
    margin: 10px 0;
    border-left: 4px solid #8B5CF6;
  }
  .box-mappa .mappa-title { color: #6D28D9; font-family: 'Fredoka', sans-serif; font-weight: 600; margin-bottom: 8px; font-size: 0.95em; }
  .box-mappa ul { list-style: none; }
  .box-mappa li { padding: 4px 0 4px 22px; position: relative; color: #444; line-height: 1.5; font-size: 0.93em; }
  .box-mappa li::before { content: "◆"; position: absolute; left: 4px; color: #8B5CF6; font-size: 0.8em; }
  .box-mappa ul ul li::before { content: "▸"; color: #A78BFA; }
  .box-mappa ul ul { padding-left: 12px; margin-top: 3px; }

  .box-verifica {
    background: #FEE2E2;
    border-radius: 12px;
    padding: 15px 20px;
    margin: 10px 0;
    border-left: 4px solid #EF4444;
  }
  .box-verifica .verifica-title { color: #B91C1C; font-family: 'Fredoka', sans-serif; font-weight: 600; margin-bottom: 8px; font-size: 0.95em; }
  .box-verifica ol, .box-verifica ul { padding-left: 22px; color: #7F1D1D; line-height: 1.6; font-size: 0.93em; }
  .box-verifica li { padding: 4px 0; }
  .box-verifica .vf { list-style: none; padding-left: 0; }
  .box-verifica .vf li { padding: 3px 0 3px 26px; position: relative; }
  .box-verifica .vf li::before { content: "◻"; position: absolute; left: 4px; font-size: 1em; }

  .expand-all-btn {
    background: linear-gradient(135deg, #FF9F43, #FFD93D);
    border: none;
    color: white;
    padding: 11px 22px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.9em;
    font-weight: 600;
    transition: all 0.3s ease;
    margin-bottom: 12px;
    box-shadow: 0 4px 0 #E67E22, 0 6px 15px rgba(255, 159, 67, 0.3);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
  }
  .expand-all-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #E67E22, 0 8px 20px rgba(255, 159, 67, 0.4); }

  .activities {
    background: linear-gradient(135deg, #FFF9E6, #FFE7A0);
    padding: 22px;
    border-radius: 18px;
    margin-top: 22px;
    border: 2px dashed #FF9F43;
  }
  .activities h3 { color: #C2410C; font-family: 'Fredoka', sans-serif; margin-bottom: 12px; display: flex; align-items: center; gap: 10px; font-size: 1.1em; font-weight: 600; }
  .activities h3::before { content: "🎯"; font-size: 1.15em; }
  .activities ul { list-style: none; }
  .activities li { padding: 6px 0 6px 25px; position: relative; color: #78350F; line-height: 1.5; font-weight: 500; }
  .activities li::before { content: "▸"; position: absolute; left: 5px; color: #F97316; font-weight: bold; }

  .progress-bar { margin-top: 25px; background: #E0F2FE; border-radius: 12px; height: 14px; overflow: hidden; border: 2px solid white; box-shadow: inset 0 2px 5px rgba(0,0,0,0.1); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #FF6B6B, #FFD93D, #6BCB77, #4A90E2, #A78BFA); border-radius: 12px; transition: width 0.5s ease; }
  .progress-label { text-align: center; margin-top: 8px; color: #2C5F9E; font-family: 'Fredoka', sans-serif; font-size: 0.9em; font-weight: 600; }

  .controls { display: flex; justify-content: space-between; margin-top: 25px; gap: 15px; flex-wrap: wrap; }

  .ctrl-btn {
    background: linear-gradient(135deg, #4A90E2, #2C5F9E);
    color: white;
    border: none;
    padding: 14px 30px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 1em;
    font-weight: 600;
    transition: all 0.3s ease;
    flex: 1;
    min-width: 140px;
    box-shadow: 0 5px 0 #1E3A5F, 0 6px 20px rgba(74, 144, 226, 0.3);
    text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
  }
  .ctrl-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 0 #1E3A5F, 0 10px 25px rgba(74, 144, 226, 0.4); }
  .ctrl-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .print-btn {
    background: linear-gradient(135deg, #6BCB77, #4CAF50);
    border: none;
    color: white;
    padding: 12px 24px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.95em;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 5px 0 #2E7D32, 0 6px 20px rgba(107, 203, 119, 0.3);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.15);
  }
  .print-btn:hover { transform: translateY(-3px); box-shadow: 0 8px 0 #2E7D32, 0 10px 25px rgba(107, 203, 119, 0.4); }

  .print-controls { display: flex; justify-content: center; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }

  .resources-intro {
    background: white;
    border-radius: 22px;
    padding: 30px;
    margin-bottom: 22px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    text-align: center;
    border: 3px solid #FFD93D;
  }
  .resources-intro h2 { color: #7C3AED; font-family: 'Fredoka', sans-serif; font-size: 1.8em; margin-bottom: 10px; }
  .resources-intro p { color: #666; font-size: 1em; line-height: 1.6; max-width: 700px; margin: 0 auto; font-weight: 500; }

  .resource-filters { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 22px; }

  .filter-btn {
    background: white;
    border: 3px solid #A78BFA;
    color: #7C3AED;
    padding: 10px 22px;
    border-radius: 50px;
    cursor: pointer;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.95em;
    font-weight: 600;
    transition: all 0.3s ease;
    box-shadow: 0 4px 0 #C4B5FD;
  }
  .filter-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #C4B5FD; }
  .filter-btn.active { background: linear-gradient(135deg, #A78BFA, #7C3AED); color: white; border-color: #7C3AED; box-shadow: 0 4px 0 #5B21B6; }

  .resources-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }

  .resource-card {
    background: white;
    border-radius: 18px;
    padding: 22px;
    box-shadow: 0 8px 25px rgba(0,0,0,0.12);
    transition: all 0.3s ease;
    display: flex;
    flex-direction: column;
    border-top: 6px solid #4A90E2;
  }
  .resource-card:hover { transform: translateY(-6px); box-shadow: 0 15px 35px rgba(0,0,0,0.2); }
  .resource-card[data-type="video"] { border-top-color: #FF6B6B; }
  .resource-card[data-type="sito"] { border-top-color: #4A90E2; }
  .resource-card[data-type="app"] { border-top-color: #6BCB77; }
  .resource-card[data-type="podcast"] { border-top-color: #FF9F43; }
  .resource-card[data-type="gioco"] { border-top-color: #A78BFA; }

  .resource-type-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: 'Fredoka', sans-serif;
    font-size: 0.8em;
    font-weight: 600;
    padding: 5px 12px;
    border-radius: 50px;
    margin-bottom: 10px;
    align-self: flex-start;
    text-transform: uppercase;
  }
  .resource-card[data-type="video"] .resource-type-badge { background: #FEE2E2; color: #B91C1C; }
  .resource-card[data-type="sito"] .resource-type-badge { background: #DBEAFE; color: #1D4ED8; }
  .resource-card[data-type="app"] .resource-type-badge { background: #D1FAE5; color: #047857; }
  .resource-card[data-type="podcast"] .resource-type-badge { background: #FEF3C7; color: #B45309; }
  .resource-card[data-type="gioco"] .resource-type-badge { background: #EDE9FE; color: #6D28D9; }

  .resource-card h3 { color: #2C5F9E; font-family: 'Fredoka', sans-serif; font-size: 1.1em; margin-bottom: 10px; line-height: 1.3; font-weight: 600; }
  .resource-card p { color: #555; font-size: 0.92em; line-height: 1.55; margin-bottom: 12px; flex-grow: 1; font-weight: 500; }
  .resource-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .meta-tag { background: #F1F5F9; color: #475569; font-size: 0.75em; padding: 4px 10px; border-radius: 20px; font-weight: 600; }

  .resource-link {
    display: inline-flex;
    align-items: center;
    gap: 8px;

        {

        {

          lezione: [
            "Il <strong>Medioevo</strong> è un lungo periodo di circa mille anni (dal 476 al 1492). È un'epoca spesso fraintesa: non fu solo un'epoca buia, ma anche un'epoca di grandi trasformazioni, di fede, di arte, di cultura.",
            "La società medievale era organizzata secondo il <strong>feudalesimo</strong>: il re concedeva terre (feudi) ai nobili (vassalli), che in cambio garantivano fedeltà e servizio militare. I contadini (servi della gleba) lavoravano la terra per i nobili e in cambio ricevevano protezione. In cima c'erano il Papa e l'imperatore.",
            "I <strong>castelli</strong> erano le dimore fortificate dei nobili: mura spesse, torri, fossati, ponte levatoio. Servivano per difendersi dalle invasioni e per controllare il territorio. La vita nel castello era dura: freddo, buio, poche comodità.",
            "Il <strong>monachesimo</strong> fu un fenomeno importantissimo: uomini e donne si ritiravano nei monasteri per dedicarsi alla preghiera, al lavoro, allo studio. I monaci <strong>amanuensi</strong> copiavano a mano i libri antichi, salvando la cultura classica. Nei monasteri c'erano anche scuole, ospedali, biblioteche.",
            "Le <strong>Crociate</strong> furono spedizioni militari (XI-XIII secolo) promosse dal Papa per liberare il Santo Sepolcro di Gerusalemme, caduto in mano ai Turchi. Furono anche un'occasione di contatto tra culture diverse, con scambi di idee, merci, conoscenze.",
            "La società medievale era organizzata in tre ordini: gli <strong>oratores</strong> (coloro che pregano: clero), i <strong>bellatores</strong> (coloro che combattono: nobili), i <strong>laboratores</strong> (coloro che lavorano: contadini e artigiani). Ognuno aveva il suo ruolo, stabilito da Dio."

            { termine: "Scoperta geografica", definizione: "l'esplorazione di terre nuove" },
            { termine: "Eliocentrismo", definizione: "la teoria che mette il Sole al centro dell'universo" }
          ],
          mappa: [
            { nodo: "Fine del Medioevo", figli: ["Nascita dei Comuni", "Rinascimento", "Scoperte geografiche (1492)", "Stampa (1450)"] },
            { nodo: "Verso l'età moderna", figli: ["Umanesimo", "Arte rinascimentale", "Navigazioni oceaniche", "Diffusione della cultura"] }
          ],
          verifica: [
            "Che cos'erano i Comuni? Fai qualche esempio.",
            "Che cos'è il Rinascimento? Quali artisti ricordi?",
            "Chi scoprì l'America? In che anno?",
            "Perché il 1492 è considerato una data importante?",
            "Chi era Galileo Galilei?"
          ],
          verificaVF: [
            "I Comuni erano città autonome (V/F)",
            "Leonardo da Vinci fu un artista del Rinascimento (V/F)",
            "Colombo scoprì l'America nel 1492 (V/F)",
            "La stampa fu inventata da Gutenberg (V/F)",
            "Galileo visse nel Medioevo (V/F)"
          ],
          attivitaPratiche: [
            "Costruisci la linea del tempo finale: dalla Preistoria all'età moderna",
            "Realizza un cartellone sul Rinascimento",
            "Racconta il viaggio di Colombo con una mappa",
            "Cerca immagini delle opere di Leonardo e Michelangelo"
          ]
        }
      ],
      attivita: ["Costruire un plastico del Colosseo o di un acquedotto","Realizzare un giornale dell'antica Roma","Drammatizzazione di una giornata nell'antica Roma","Ricerca sulle divinità romane","Costruire un castello medievale con materiali di riciclo","Visita a un sito romano o medievale del territorio","Linea del tempo finale: dalla Preistoria all'età moderna","Realizzare un plastico di un feudo medievale"]
    }
  ];
</script>
<script>
  /* ============================================================
     LOGICA (identica alla versione originale)
  ============================================================ */
  const risorse = [
    { tipo: "video", titolo: "RaiPlay - Ulisse il piacere della scoperta", descrizione: "Documentari divulgativi di Alberto Angela sulla storia, l'archeologia e le civiltà antiche.", tags: ["Documentari", "Civiltà antiche", "Tutte le classi"], link: "https://www.raiplaysound.it/programmi/ulisseilpiacerescopertailpiaceredellascoperta" },
    { tipo: "video", titolo: "Rai Scuola - Storia", descrizione: "Video didattici sulla storia per la scuola primaria e secondaria.", tags: ["Didattica", "Video lezioni", "Tutte le classi"], link: "https://www.raiscuola.rai.it/" },
    { tipo: "video", titolo: "TED-Ed - Storia (canale YouTube)", descrizione: "Video animati brevi e coinvolgenti su eventi storici, personaggi e civiltà.", tags: ["Animazione", "Internazionale", "Classi 4-5"], link: "https://www.youtube.com/@TEDEd" },
    { tipo: "video", titolo: "La Storia dell'Uomo - Paleolitico e Neolitico", descrizione: "Video didattici sull'evoluzione umana e sulla Preistoria.", tags: ["Preistoria", "Evoluzione", "Classe 3"], link: "https://www.youtube.com/results?search_query=preistoria+scuola+primaria" },
    { tipo: "video", titolo: "Gli Egizi e le Piramidi - Video didattico", descrizione: "Video animati che raccontano la civiltà egizia in modo semplice e accattivante.", tags: ["Egizi", "Civiltà antiche", "Classe 4"], link: "https://www.youtube.com/results?search_query=egizi+scuola+primaria" },
    { tipo: "sito", titolo: "Treccani Ragazzi - Storia", descrizione: "Enciclopedia online per ragazzi con voci semplificate sulla storia.", tags: ["Enciclopedia", "Approfondimento", "Classi 4-5"], link: "https://www.treccani.it/ragazzi/" },
    { tipo: "sito", titolo: "Focus Junior - Storia", descrizione: "Articoli, curiosità e quiz sulla storia per bambini e ragazzi.", tags: ["Articoli", "Curiosità", "Tutte le classi"], link: "https://www.focusjunior.it/" },
    { tipo: "sito", titolo: "Museo Egizio di Torino - Sezione Junior", descrizione: "Sezione del museo dedicata ai bambini con giochi e percorsi interattivi.", tags: ["Museo", "Egizi", "Classe 4"], link: "https://museoegizio.it/" },
    { tipo: "sito", titolo: "Parco Archeologico di Pompei - Kids", descrizione: "Sezione junior con mappe, giochi e storie per scoprire la vita nell'antica Roma.", tags: ["Archeologia", "Roma", "Classe 5"], link: "https://pompeiisites.org/" },
    { tipo: "sito", titolo: "INVALSI - Prove di Storia", descrizione: "Esempi di prove e esercitazioni sulle competenze storiche.", tags: ["Esercitazioni", "Competenze", "Classi 4-5"], link: "https://www.invalsi.it/" },
    { tipo: "app", titolo: "Timeline - Linea del Tempo", descrizione: "App per creare linee del tempo interattive e personalizzate.", tags: ["Linea del tempo", "Interattiva", "Tutte le classi"], link: "https://www.readwritethink.org/" },
    { tipo: "app", titolo: "Kahoot! - Quiz di Storia", descrizione: "Piattaforma di quiz interattivi con migliaia di quiz già pronti.", tags: ["Quiz", "Gamification", "Tutte le classi"], link: "https://kahoot.com/" },
    { tipo: "app", titolo: "Google Arts & Culture", descrizione: "App e sito per esplorare musei e siti archeologici con tour virtuali.", tags: ["Tour virtuali", "Musei", "Classi 4-5"], link: "https://artsandculture.google.com/" },
    { tipo: "app", titolo: "British Museum - App Kids", descrizione: "App con giochi e percorsi interattivi per esplorare le civiltà antiche.", tags: ["Museo", "Civiltà antiche", "Classi 4-5"], link: "https://www.britishmuseum.org/" },
    { tipo: "podcast", titolo: "RaiPlay Sound - Storie per Bambini", descrizione: "Podcast di storie e racconti storici per bambini.", tags: ["Racconti", "Asilo", "Tutte le classi"], link: "https://www.raiplaysound.it/" },
    { tipo: "podcast", titolo: "La Storia per i Bambini - Podcast", descrizione: "Podcast che racconta la storia in modo semplice e divertente.", tags: ["Narrazione", "Episodi brevi", "Classi 3-5"], link: "https://www.spreaker.com/" },
    { tipo: "podcast", titolo: "WikiStoria - Podcast didattico", descrizione: "Podcast didattico con episodi tematici sulla storia.", tags: ["Didattica", "Approfondimento", "Classi 4-5"], link: "https://open.spotify.com/" },
    { tipo: "gioco", titolo: "Il Gioco dell'Antico Egitto", descrizione: "Gioco interattivo per scoprire la civiltà egizia.", tags: ["Egizi", "Gioco online", "Classe 4"], link: "https://www.brainpop.com/" },
    { tipo: "gioco", titolo: "Roma Antica - Gioco di Ruolo", descrizione: "Giochi di ruolo e simulazioni per vivere un giorno nell'antica Roma.", tags: ["Roma", "Simulazione", "Classe 5"], link: "https://www.education.com/games/" },
    { tipo: "gioco", titolo: "Caccia al Tesoro nella Preistoria", descrizione: "Gioco didattico con enigmi e indovinelli sulla Preistoria.", tags: ["Preistoria", "Enigmi", "Classe 3"], link: "https://www.nationalgeographic.org/education/" },
    { tipo: "gioco", titolo: "Quiz Time - Storia per la Primaria", descrizione: "Raccolta di quiz e giochi a quiz sulla storia, divisi per classe.", tags: ["Quiz", "Ripasso", "Tutte le classi"], link: "https://www.wordwall.net/it" }
  ];

  let currentIndex = 0;
  let currentSearch = "";

  function renderNav() {
    const nav = document.getElementById('navButtons');
    nav.innerHTML = '';
    programmi.forEach((p, i) => {
      const btn = document.createElement('button');
      btn.className = 'nav-btn' + (i === currentIndex ? ' active' : '');
      btn.textContent = `${p.anno}°`;
      btn.onclick = () => goTo(i);
      nav.appendChild(btn);
    });
  }

  function highlightText(text, query) {
    if (!query) return text;
    const escaped = query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    return text.replace(new RegExp(`(${escaped})`, 'gi'), '<span class="search-highlight">$1</span>');
  }

  function matchSearch(arg, query) {
    if (!query) return true;
    const q = query.toLowerCase();
    const parts = [
      arg.titolo || '', ...(arg.lezione || []), arg.approfondimento || '',
      arg.curiosita || '', arg.vita || '', arg.oggi || '',
      ...(arg.glossario || []).map(g => g.termine + ' ' + g.definizione),
      ...(arg.personaggi || []).map(p => p.nome + ' ' + p.descrizione),
      ...(arg.fonti || []),
      ...(arg.mappa || []).map(m => m.nodo + ' ' + (m.figli || []).join(' ')),
      ...(arg.verifica || []), ...(arg.verificaVF || []), ...(arg.attivitaPratiche || [])
    ];
    return parts.join(' ').toLowerCase().includes(q);
  }

  function renderArgomento(a, i, j, query, isSearchActive) {
    let extraHtml = "";
    if (a.approfondimento) extraHtml += `<h4>🔍 Approfondimento</h4><div class="box-approfondimento">${highlightText(a.approfondimento, query)}</div>`;
    if (a.personaggi) extraHtml += `<h4>👤 Personaggi</h4><div class="box-personaggi"><ul>${a.personaggi.map(p => `<li><strong>${highlightText(p.nome, query)}:</strong> ${highlightText(p.descrizione, query)}</li>`).join('')}</ul></div>`;
    if (a.vita) extraHtml += `<h4>🏺 Vita quotidiana</h4><div class="box-vita">${highlightText(a.vita, query)}</div>`;
    if (a.fonti) extraHtml += `<h4>🔎 Fonti e reperti</h4><div class="box-fonti"><ul>${a.fonti.map(f => `<li>${highlightText(f, query)}</li>`).join('')}</ul></div>`;
    if (a.curiosita) extraHtml += `<h4>🌟 Lo sapevi?</h4><div class="box-curiosita">${highlightText(a.curiosita, query)}</div>`;
    if (a.oggi) extraHtml += `<h4>🌍 Collegamenti con oggi</h4><div class="box-oggi">${highlightText(a.oggi, query)}</div>`;
    if (a.cronologia) extraHtml += `<h4>⏱ Cronologia</h4><div class="box-cronologia"><div class="crono-title">Date importanti</div><ul>${a.cronologia.map(c => `<li><strong>${highlightText(c.data, query)}:</strong> ${highlightText(c.evento, query)}</li>`).join('')}</ul></div>`;
    if (a.glossario) extraHtml += `<h4>📚 Glossario</h4><div class="box-glossario"><ul>${a.glossario.map(g => `<li><strong>${highlightText(g.termine, query)}:</strong> ${highlightText(g.definizione, query)}</li>`).join('')}</ul></div>`;
    if (a.mappa) extraHtml += `<h4>🗺️ Mappa concettuale</h4><div class="box-mappa"><div class="mappa-title">Schema riassuntivo</div><ul>${a.mappa.map(m => `<li><strong>${highlightText(m.nodo, query)}</strong><ul>${m.figli.map(f => `<li>${highlightText(f, query)}</li>`).join('')}</ul></li>`).join('')}</ul></div>`;
    if (a.verifica) extraHtml += `<h4>✅ Verifica - Domande aperte</h4><div class="box-verifica"><div class="verifica-title">Rispondi alle domande</div><ol>${a.verifica.map(v => `<li>${highlightText(v, query)}</li>`).join('')}</ol></div>`;
    if (a.verificaVF) extraHtml += `<div class="box-verifica"><div class="verifica-title">Vero o Falso</div><ul class="vf">${a.verificaVF.map(v => `<li>${highlightText(v, query)}</li>`).join('')}</ul></div>`;
    if (a.attivitaPratiche) extraHtml += `<h4>✏️ Attività pratiche</h4><div class="box-attivita"><ul>${a.attivitaPratiche.map(at => `<li>${highlightText(at, query)}</li>`).join('')}</ul></div>`;
    const openClass = isSearchActive ? 'open' : '';
    return `
      <li class="topic-item ${openClass}" id="topic-${i}-${j}">
        <div class="topic-header" onclick="toggleTopic(${i}, ${j})">
          <span>${highlightText(a.titolo, query)}</span>
          <span class="topic-toggle-icon">▼</span>
        </div>
        <div class="topic-body">
          <div class="topic-detail">
            <h4>📖 Lezione</h4>
            <div class="lezione-text">${a.lezione.map((par, k) => `<p${k === 0 ? ' class="capolettera"' : ''}>${highlightText(par, query)}</p>`).join('')}</div>
            ${extraHtml}
          </div>
        </div>
      </li>`;
  }

  function renderCards() {
    const container = document.getElementById('yearCards');
    container.innerHTML = '';
    const query = currentSearch.trim();
    const isSearchActive = query.length > 0;
    let totalMatches = 0;
    const matchesPerClasse = [];

    programmi.forEach((p, i) => {
      const filteredArgomenti = p.argomenti.filter(a => matchSearch(a, query));
      const matchCount = filteredArgomenti.length;
      matchesPerClasse.push(matchCount);
      totalMatches += matchCount;

      const card = document.createElement('div');
      card.className = 'year-card' + (i === currentIndex ? ' active' : '');
      card.dataset.classe = i;

      if (isSearchActive && matchCount === 0) {
        card.style.display = 'none';
        container.appendChild(card);
        return;
      }

      card.innerHTML = `
        <div class="year-header">
          <div class="year-badge">${p.anno}°</div>
          <div class="year-title">
            <h2>${p.titolo}</h2>
            <p>${p.sottotitolo}</p>
          </div>
        </div>
        <div class="book-intro">${p.introduzione}</div>
        <div class="theme-section">
          <h3>${isSearchActive ? `Risultati della ricerca (${matchCount})` : 'Lezioni del libro'}</h3>
          <button class="expand-all-btn" onclick="toggleAllTopics(${i})">Espandi / Comprimi tutte le lezioni</button>
          <ul class="topic-list">
            ${filteredArgomenti.map((a) => {
              const originalIndex = p.argomenti.indexOf(a);
              return renderArgomento(a, i, originalIndex, query, isSearchActive);
            }).join('')}
          </ul>
        </div>
        <div class="activities">
          <h3>Attività e laboratori suggeriti</h3>
          <ul>${p.attivita.map(a => `<li>${a}</li>`).join('')}</ul>
        </div>
        <div class="progress-bar"><div class="progress-fill" style="width: ${((i + 1) / programmi.length) * 100}%"></div></div>
        <p class="progress-label">Anno ${p.anno} di 5 - ${Math.round(((i + 1) / programmi.length) * 100)}% del percorso</p>
        <div class="controls">
          <button class="ctrl-btn" onclick="prev()" ${i === 0 ? 'disabled' : ''}>← Precedente</button>
          <button class="ctrl-btn" onclick="next()" ${i === programmi.length - 1 ? 'disabled' : ''}>Successivo →</button>
        </div>`;
      container.appendChild(card);
    });

    const info = document.getElementById('searchInfo');
    if (isSearchActive) {
      info.textContent = totalMatches > 0
        ? `🔍 Trovati ${totalMatches} argomenti in ${matchesPerClasse.filter(c => c > 0).length} classi per "${query}"`
        : `😕 Nessun risultato per "${query}". Prova con un'altra parola.`;
      info.style.color = totalMatches > 0 ? '#2C5F9E' : '#E74C3C';
      if (totalMatches > 0 && matchesPerClasse[currentIndex] === 0) {
        const firstMatch = matchesPerClasse.findIndex(c => c > 0);
        if (firstMatch !== -1) {
          currentIndex = firstMatch;
          renderNav();
          document.querySelectorAll('.year-card').forEach((c, idx) => {
            c.classList.toggle('active', idx === currentIndex);
          });
        }
      }
    } else {
      info.textContent = '';
    }
  }

  function toggleTopic(annoIndex, topicIndex) {
    const item = document.getElementById(`topic-${annoIndex}-${topicIndex}`);
    if (item) item.classList.toggle('open');
  }

  function toggleAllTopics(annoIndex) {
    const items = document.querySelectorAll(`[id^="topic-${annoIndex}-"]`);
    const anyOpen = Array.from(items).some(it => it.classList.contains('open'));
    items.forEach(it => it.classList.toggle('open', !anyOpen));
  }

  function goTo(index) {
    currentIndex = index;
    renderNav();
    document.querySelectorAll('.year-card').forEach((c, i) => {
      c.classList.toggle('active', i === currentIndex);
    });
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function next() { if (currentIndex < programmi.length - 1) goTo(currentIndex + 1); }
  function prev() { if (currentIndex > 0) goTo(currentIndex - 1); }

  /* ===================== STAMPA CORRETTA ===================== */
  function printCurrent() {
    // Chiude tutte le card
    document.querySelectorAll('.year-card').forEach(c => c.classList.remove('print-target'));
    // Apre solo quella corrente
    const current = document.querySelector(`.year-card[data-classe="${currentIndex}"]`);
    if (current) current.classList.add('print-target');
    
    // Aspetta che il browser ridisegni prima di stampare
    setTimeout(() => {
      window.print();
      // Pulisce dopo la stampa
      setTimeout(() => {
        document.querySelectorAll('.year-card').forEach(c => c.classList.remove('print-target'));
      }, 800);
    }, 150);
  }

  function printAll() {
    // Apre tutte le card
    document.querySelectorAll('.year-card').forEach(c => {
      c.classList.add('print-target');
      c.style.display = 'block';
    });
    
    setTimeout(() => {
      window.print();
      setTimeout(() => {
        document.querySelectorAll('.year-card').forEach(c => {
          c.classList.remove('print-target');
          c.style.display = '';
        });
      }, 800);
    }, 150);
  }

  function initSearch() {
    const input = document.getElementById('searchInput');
    const clear = document.getElementById('searchClear');
    let debounceTimer;

    input.addEventListener('input', (e) => {
      const val = e.target.value;
      clear.classList.toggle('visible', val.length > 0);
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        currentSearch = val;
        renderCards();
      }, 250);
    });

    clear.addEventListener('click', () => {
      input.value = '';
      currentSearch = '';
      clear.classList.remove('visible');
      renderCards();
      input.focus();
    });

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        input.value = '';
        currentSearch = '';
        clear.classList.remove('visible');
        renderCards();
      }
    });
  }

  const typeLabels = { video: "🎥 Video", sito: "🌐 Sito", app: "📱 App", podcast: "🎧 Podcast", gioco: "🎮 Gioco" };
  let currentFilter = 'tutti';

  function renderResources() {
    const grid = document.getElementById('resourcesGrid');
    grid.innerHTML = '';
    const filtered = currentFilter === 'tutti' ? risorse : risorse.filter(r => r.tipo === currentFilter);
    if (filtered.length === 0) {
      grid.innerHTML = `<div class="no-results">Nessuna risorsa trovata per questa categoria.</div>`;
      return;
    }
    filtered.forEach(r => {
      const card = document.createElement('div');
      card.className = 'resource-card';
      card.dataset.type = r.tipo;
      card.innerHTML = `
        <span class="resource-type-badge">${typeLabels[r.tipo] || r.tipo}</span>
        <h3>${r.titolo}</h3>
        <p>${r.descrizione}</p>
        <div class="resource-meta">${r.tags.map(t => `<span class="meta-tag">${t}</span>`).join('')}</div>
        <a class="resource-link" href="${r.link}" target="_blank" rel="noopener noreferrer">Apri risorsa →</a>`;
      grid.appendChild(card);
    });
  }

  function initResourceFilters() {
    const filters = document.getElementById('resourceFilters');
    filters.addEventListener('click', (e) => {
      const btn = e.target.closest('.filter-btn');
      if (!btn) return;
      filters.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentFilter = btn.dataset.filter;
      renderResources();
    });
  }

  function switchSection(sectionId, btn) {
    document.querySelectorAll('.main-tab').forEach(t => t.classList.remove('active'));
    if (btn) btn.classList.add('active');
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(sectionId).classList.add('active');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  renderNav();
  renderCards();
  renderResources();
  initResourceFilters();
  initSearch();
</script>
</body>
</html>
